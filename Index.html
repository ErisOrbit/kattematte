<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>KatteMate</title>
    <link rel="stylesheet" href="./bakgrund.css">
    <script src="./main.js"></script>
</head>
<body>
    

    <div class="app-container">
        <h1>KATTE MATE</h1>

        <!-- Nivåvalg (fra flytskjemaet) -->
        <div id="nivaa-velger" style="margin-bottom: 15px;">
            <p>Velg nivå:</p>
            <button class="nivaa-knapp" onclick="startSpill('lett')">Lett</button>
            <button class="nivaa-knapp" onclick="startSpill('middels')">Middels</button>
            <button class="nivaa-knapp" onclick="startSpill('vanskelig')">Vanskelig</button>
        </div>

        <!-- Topp-panel med poeng, tid og knapper -->
        <div class="topp-panel">
            <span id="poeng-tekst">Poeng: 0</span>
            <div>
                <span>TID</span><br>
                <progress id="tid-bar" value="100" max="100"></progress>
            </div>
            <div>
                <button onclick="byttLyd()">🔊</button>
                <button onclick="visMeny()">☰</button>
            </div>
        </div>

        <!-- Matteoppgaven -->
        <div class="matte-oppgave" id="oppgave-tekst">
            Velg nivå over!
        </div>

        <p>Velg et av tallene du tror er riktig svar:</p>

        <!-- Svaralternativer -->
        <div id="svar-knapper">
            <button class="spill-knapp" onclick="sjekkSvar(this)">-</button>
            <button class="spill-knapp" onclick="sjekkSvar(this)">-</button><br>
            <button class="spill-knapp" onclick="sjekkSvar(this)">-</button>
            <button class="spill-knapp" onclick="sjekkSvar(this)">-</button>
        </div>

        <!-- Kattens tilbakemelding -->
        <div style="margin-top: 20px;">
            <h3>Hei! Jeg er KatteMate!</h3>
            <p id="katte-melding">Svar riktig for å samle poeng.</p>
        </div>
    </div>

    <script src="./spill.js"></script>
</body>
</html>
