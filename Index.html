<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>KatteMate</title>
    <link rel="stylesheet" href="./bakgrund.css">
    <script src="./main.js"></script>
</head>
<body>
    

    <div class="app-container">
        <img src="./cat.png" alt="kattematte" class="katt">
        <h1>KATTE MATE</h1>

        <!-- Nivåvalg (fra flytskjemaet) -->
        <div id="nivaa-velger" style="margin-bottom: 15px;">
            <p>Velg nivå:</p>
            <button class="nivaa-knapp" onclick="startSpill('lett')">Lett</button>
            <button class="nivaa-knapp" onclick="startSpill('middels')">Middels</button>
            <button class="nivaa-knapp" onclick="startSpill('vanskelig')">Vanskelig</button>
        </div>

        <!-- Topp-panel med poeng, tid og knapper -->
        <div class="topp-panel">
            <span id="poeng-tekst">Poeng: 0</span>
            <div>
                <span>TID</span><br>
                <progress id="tid-bar" value="60" max="60"></progress>
            </div>
            <div>
                <button id="lyd-knapp" type="button" onclick="byttLyd()">🔊</button>
                <button onclick="visMeny()">☰</button>
            </div>
        </div>

        <!-- Matteoppgaven -->
        <div class="matte-oppgave" id="oppgave-tekst">
            Velg nivå over!
        </div>

        <p>Velg et av tallene du tror er riktig svar:</p>

        <!-- Svaralternativer -->
        <div id="svar-knapper">
            <button class="spill-knapp" onclick="sjekkSvar(this)">-</button>
            <button class="spill-knapp" onclick="sjekkSvar(this)">-</button><br>
            <button class="spill-knapp" onclick="sjekkSvar(this)">-</button>
            <button class="spill-knapp" onclick="sjekkSvar(this)">-</button>
        </div>

        <!-- Kattens tilbakemelding -->
        <div style="margin-top: 20px;">
            <h3>Hei! Jeg er KatteMate!</h3>
            <p id="katte-melding">Svar riktig for å samle poeng.</p>
        </div>
    </div>

    <div id="pause-meny" class="pause-meny" hidden>
        <div class="pause-panel" role="dialog" aria-modal="true" aria-labelledby="pause-tittel">
            <h2 id="pause-tittel">Pause</h2>

            <div class="pause-seksjon">
                <h3>Spillbildet</h3>
                <div class="kildeboks">
                    <img src="./bg.jpg" alt="Bakgrunnsbilde brukt i spillet">
                    <p><strong>Bakgrunnsbilde:</strong> <code>AI (dont support)</code></p>
                </div>
            </div>

            <div class="pause-seksjon">
                <h3>Ikoner</h3>
                <div class="kildeboks">
                    <img src="./cat.png" alt="Katt-ikon brukt i spillet" style="width: 90px; height: 90px;">
                    <p><strong>Katt-ikon:</strong> <code>AI (dont support)</code></p>
                </div>
            </div>

            <div class="pause-seksjon">
                <h3>Musikk</h3>
                <p><strong>Bakgrunnsmusikk:</strong></p>
                <p><code>zvukipro.com</code></p>
            </div>

            <button class="nivaa-knapp" type="button" onclick="fortsettSpill()">Fortsett spillet</button>
        </div>
    </div>

</body>
</html>
